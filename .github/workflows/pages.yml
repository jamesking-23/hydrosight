name: Deploy static preview (GitHub Pages)

# A static progress preview of the web app only. The API, database and the /health and
# /ready server routes are NOT part of this preview (Pages serves static files).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: pnpm install --frozen-lockfile
      # Server-only routes cannot be statically exported; remove them for this build only.
      - run: rm -rf apps/web/src/app/health apps/web/src/app/ready
      - run: pnpm build:web
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: touch apps/web/out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
