[project]
name = "hydrosight-api"
version = "0.0.0"
description = "HydroSight API: ingestion, scientific jobs, forecasts, alert engine workers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pgserver>=0.1.4; python_version < '3.13'",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

# GIS import pipeline only (not deployed): `uv run --group geo python -m hydrosight_api.geoimport ...`
geo = [
  "geopandas>=1.0",
  "pyogrio>=0.9",
  "shapely>=2.0",
  "pyproj>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hydrosight_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501", "S608"]
# SQL strings read better unwrapped
"src/hydrosight_api/alerts_public.py" = ["E501"]
"src/hydrosight_api/notifications.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["geopandas.*", "shapely.*", "pyogrio.*", "pyproj.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
